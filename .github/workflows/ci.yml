name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    name: Verify (lint · validate · test · package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax + MV3 hygiene checks
        run: npm run check

      - name: Validate manifest
        run: npm run validate

      - name: Unit + integration tests
        run: npm test

      - name: Package extension
        run: npm run package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: keurweb-zip
          path: dist/*.zip
          retention-days: 14

  release:
    name: Attach release zip (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package
        run: npm run package

      - name: Create GitHub release with the zip
        uses: softprops/action-gh-release@v2
        with:
          files: dist/keurweb-*.zip
          generate_release_notes: true
